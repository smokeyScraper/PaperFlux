[project]
name = "paperflux"
version = "0.1.0"
description = "AI research paper insights from Hugging Face Daily Papers"
authors = [
    {name = "kartikbhtt7",email = "kartikbhtt7@gmail.com"},
    {name = "Vector73",email = "v.shm.kunal@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "streamlit (>=1.42.2,<2.0.0)",
    "httpx (>=0.28.1,<1.0.0)",
    "aiohttp (>=3.11.12,<4.0.0)",
    "pymongo (>=4.11.1,<5.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "pytz (>=2025.1)",
    "pillow (>=11.1.0)",
    "lameenc (>=1.9.0,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.9.6"
black = ">=25.1.0"
flake8 = ">=7.1.1"
# Only used by tests/pdf_workflow_test.py (manual script); production code calls Gemini via httpx.
google-generativeai = ">=0.8.4"
